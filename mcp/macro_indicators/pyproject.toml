[project]
name = "macro-indicators-mcp"
version = "0.1.0"
description = "Alpha-Guardian Macro Indicators Service"
requires-python = ">=3.11"
dependencies = [
    "fastmcp==3.3.1",
    "fastapi>=0.109.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.0.0",
    "polars>=1.40.1",
    "python-bcb>=0.3.6",
    "httpx>=0.26.0",
    "starlette>=0.35.0",
    "requests>=2.31.0",
    "psycopg2-binary>=2.9.9",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []
include = ["*.py"]
