[project]
name = "fundamental-analysis-mcp"
version = "0.1.0"
description = "GICS-Aware Fundamental Analysis MCP Server"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "fastmcp>=0.4.1",
    "yfinance>=0.2.40",
    "pydantic>=2.9.0",
    "psycopg2-binary>=2.9.9",
    "starlette>=0.35.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "methodologies", "providers"]
